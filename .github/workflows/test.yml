name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  test:
    name: Importer test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        working-directory: src
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Prepare Nuxt (generate .nuxt/tsconfig.json)
        working-directory: src
        run: npx nuxt prepare
      - name: Run tests
        working-directory: src
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        working-directory: src
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Run production build
        working-directory: src
        env:
          NODE_ENV: production
        run: npm run build

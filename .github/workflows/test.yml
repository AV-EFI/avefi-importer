name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  test:
    name: Importer test suite
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Prepare Nuxt (generate .nuxt/tsconfig.json)
        working-directory: src
        run: npx nuxt prepare
      - name: Run tests
        working-directory: src
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Run production build
        working-directory: src
        env:
          NODE_ENV: production
        run: npm run build
